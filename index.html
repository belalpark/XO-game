<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101629"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>XO كأس التحدي</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#243b68,#0a1021 70%);color:#fff;font-family:system-ui,Arial;min-height:100dvh}main{max-width:700px;margin:auto;padding:18px}h1{text-align:center;margin:10px}p{color:#bbc9e8;text-align:center}.panel{background:#17233d;border:1px solid #405075;border-radius:20px;padding:18px;margin:16px 0}.options{display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid #536588;background:#283a5b;color:white;border-radius:12px;padding:12px;font:inherit;cursor:pointer;touch-action:manipulation}button.selected{background:#087f8c;border-color:#54f4e2}button.primary{background:#1d9e8c;font-weight:800;width:100%;margin-top:15px}label{display:block;margin:14px 0 7px;font-weight:700}.hide{display:none!important}.stats{display:flex;justify-content:space-between;gap:8px;align-items:center}.stats div{flex:1;text-align:center;background:#273756;padding:10px;border-radius:12px}.board{display:grid;gap:3px;width:min(94vw,540px);aspect-ratio:1;margin:18px auto;direction:ltr}.cell{min-width:0;min-height:0;padding:0;border-radius:5px;font-size:clamp(12px,6vw,38px);font-weight:900;background:#223658}.cell.x{color:#68e4e1}.cell.o{color:#ffbd72}.cell:disabled{opacity:1}#message{text-align:center;font-size:1.2rem;font-weight:700;min-height:2em}.timer{font-size:2rem;text-align:center;font-weight:900;color:#ffe28c}.actions{display:flex;gap:10px}.actions button{flex:1}.small{font-size:.85rem}audio{width:100%}@media(max-width:380px){main{padding:9px}.panel{padding:12px}}</style></head><body><main><h1>🏆 XO كأس التحدي</h1><p>لعبة عائلية على جهاز واحد • X يبدأ دائمًا</p><section id="settings" class="panel"><label>حجم اللوحة</label><div class="options" data-setting="size"><button data-value="3" class="selected">3×3</button><button data-value="6">6×6</button><button data-value="9">9×9</button><button data-value="16">16×16</button></div><label>مستوى الصعوبة</label><div class="options" data-setting="difficulty"><button data-value="easy">سهل</button><button data-value="medium" class="selected">متوسط</button><button data-value="hard">صعب</button></div><label>التحديات بعد الفوز</label><div class="options" data-setting="challenges"><button data-value="yes" class="selected">نعم</button><button data-value="no">لا</button></div><label>الصوت</label><div class="options" data-setting="sound"><button data-value="yes" class="selected">مفعّل</button><button data-value="no">صامت</button></div><label>مدة الدور</label><div class="options" data-setting="seconds"><button data-value="5" class="selected">5 ثوانٍ</button><button data-value="10">10 ثوانٍ</button><button data-value="15">15 ثانية</button></div><label>نظام اللعب</label><div class="options" data-setting="rounds"><button data-value="5" class="selected">بطولة 5 جولات</button><button data-value="1">جولة واحدة</button></div><button id="start" class="primary">ابدأ اللعب ▶</button></section><section id="game" class="hide"><div class="panel stats"><div>❌ X <strong id="scoreX">0</strong></div><div>الجولة <strong id="round">1</strong></div><div>⭕ O <strong id="scoreO">0</strong></div></div><div id="message">دور X</div><div class="timer" id="timer">5</div><div id="board" class="board"></div><div class="actions"><button id="restart">إعادة البطولة</button><button id="back">الإعدادات</button></div><section id="challenge" class="panel hide"><h2>🎤 تحدي الفائز</h2><p id="challengeText"></p><div class="actions"><button id="record">تسجيل التحدي</button><button id="stop" disabled>إيقاف</button></div><audio id="playback" controls class="hide"></audio><p class="small">التسجيل اختياري ويتطلب إذن الميكروفون واتصال HTTPS</p><button id="next" class="primary">الجولة التالية</button></section><button id="nextSimple" class="primary hide">الجولة التالية</button></section><p id="installTip" class="small">📱 لإضافة اللعبة للشاشة الرئيسية: في Safari اختر مشاركة ← إضافة إلى الشاشة الرئيسية. في Android اختر تثبيت التطبيق من قائمة المتصفح.</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),settings={size:3,difficulty:'medium',challenges:'yes',sound:'yes',seconds:5,rounds:5};let board=[],turn='X',round=1,scores={X:0,O:0},over=false,seconds=5,ticker=null,recorder=null,stream=null,audioContext=null;
document.querySelectorAll('[data-setting]').forEach(group=>group.addEventListener('click',e=>{const b=e.target.closest('button[data-value]');if(!b)return;group.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));const key=group.dataset.setting;settings[key]=['size','seconds','rounds'].includes(key)?Number(b.dataset.value):b.dataset.value}));
function tone(){if(settings.sound!=='yes')return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);o.frequency.value=660;g.gain.value=.045;o.start();o.stop(audioContext.currentTime+.09)}catch(e){}}
function winLength(){const base=settings.size===3?3:settings.size===6?4:5;return settings.size===3?3:Math.max(3,Math.min(settings.size,base+(settings.difficulty==='easy'?-1:settings.difficulty==='hard'?1:0)))}
function start(){round=1;scores={X:0,O:0};$('settings').classList.add('hide');$('game').classList.remove('hide');newRound()}
function newRound(){clearInterval(ticker);over=false;turn='X';board=Array(settings.size**2).fill('');$('challenge').classList.add('hide');$('nextSimple').classList.add('hide');$('scoreX').textContent=scores.X;$('scoreO').textContent=scores.O;$('round').textContent=round;$('message').textContent='دور X • اربح '+winLength()+' خانات متتالية';const el=$('board');el.innerHTML='';el.style.gridTemplateColumns='repeat('+settings.size+',1fr)';board.forEach((_,i)=>{const b=document.createElement('button');b.className='cell';b.type='button';b.setAttribute('aria-label','خانة '+(i+1));b.addEventListener('click',()=>move(i));el.appendChild(b)});resetTimer()}
function resetTimer(){clearInterval(ticker);seconds=settings.seconds;$('timer').textContent=seconds;ticker=setInterval(()=>{if(over){clearInterval(ticker);return}seconds--;$('timer').textContent=seconds;if(seconds<=3&&seconds>0)tone();if(seconds<=0){const free=board.map((v,i)=>v?null:i).filter(v=>v!==null);if(free.length)move(free[Math.floor(Math.random()*free.length)]);else finish(null)}},1000)}
function check(index){const n=settings.size,k=winLength(),r=Math.floor(index/n),c=index%n,s=turn;for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let count=1;for(const sign of [-1,1]){let rr=r+dr*sign,cc=c+dc*sign;while(rr>=0&&rr<n&&cc>=0&&cc<n&&board[rr*n+cc]===s){count++;rr+=dr*sign;cc+=dc*sign}}if(count>=k)return true}return false}
function move(i){if(over||board[i])return;board[i]=turn;const cell=$('board').children[i];cell.textContent=turn;cell.classList.add(turn.toLowerCase());cell.disabled=true;tone();if(check(i)){finish(turn);return}if(board.every(Boolean)){finish(null);return}turn=turn==='X'?'O':'X';$('message').textContent='دور '+turn;resetTimer()}
function finish(winner){over=true;clearInterval(ticker);if(winner)scores[winner]++;$('scoreX').textContent=scores.X;$('scoreO').textContent=scores.O;const last=round>=settings.rounds;$('message').textContent=winner?'🏆 فاز '+winner+(last?' • انتهت البطولة':''):'🤝 تعادل'+(last?' • انتهت البطولة':'');if(last){const champion=scores.X===scores.O?'تعادل البطولة':scores.X>scores.O?'البطل X':'البطل O';$('message').textContent+=' | '+champion}if(winner&&settings.challenges==='yes'){$('challengeText').textContent='الفائز '+winner+' يختار تحديًا لطيفًا للخاسر. يمكنك تسجيله صوتيًا.';$('challenge').classList.remove('hide');$('next').textContent=last?'بطولة جديدة':'الجولة التالية'}else{$('nextSimple').classList.remove('hide');$('nextSimple').textContent=last?'بطولة جديدة':'الجولة التالية'}}
function next(){if(round>=settings.rounds){round=1;scores={X:0,O:0}}else round++;newRound()}
$('start').addEventListener('click',start);$('restart').addEventListener('click',start);$('back').addEventListener('click',()=>{clearInterval(ticker);$('game').classList.add('hide');$('settings').classList.remove('hide')});$('next').addEventListener('click',next);$('nextSimple').addEventListener('click',next);
$('record').addEventListener('click',async()=>{try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('التسجيل غير مدعوم في هذا المتصفح');stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});$('playback').src=URL.createObjectURL(blob);$('playback').classList.remove('hide');stream.getTracks().forEach(t=>t.stop())};recorder.start();$('record').disabled=true;$('stop').disabled=false}catch(e){alert('تعذر التسجيل: '+e.message)}});$('stop').addEventListener('click',()=>{if(recorder?.state==='recording')recorder.stop();$('record').disabled=false;$('stop').disabled=true});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
})();
</script></body></html>
